11.8-xsmall:
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1500Mi
  persistence: 10Gi
  wsrepProviderOptions:
    repl.max_ws_size: "134217728"
    gcache.size: 512M
    gcs.fc_limit: "8"
  mariadbConfiguration: |
    [mariadb]
      innodb-buffer-pool-size=300M
      key-buffer-size=64K
      max-allowed-packet=128M
      max-heap-table-size=1M
