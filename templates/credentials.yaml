{{/*
  The connection details this service hands out. Arcana resolves every entry and writes
  the results into one secret in the instance namespace; the framework itself never reads
  the values.

  The expressions in the examples below are arcana's own templating, resolved by the
  controller against the resolved credentials. They are wrapped in backticks so helm
  passes them through untouched instead of evaluating them at render time.
*/}}
apiVersion: arcana.helmetica.io/v1
kind: Arcanum
metadata:
  name: credentials
  labels:
    {{- include "mariadb.labels" . | nindent 4 }}
spec:
  target:
    name: {{ .Values.credentials.targetSecret | default (printf "%s-credentials" .Release.Name) | quote }}
  # Replace with this service's credentials. Every entry becomes a key in the target
  # secret, named as its consumers read it. One example per source, indented ready to
  # paste over the line below:
  #
  # credentials:
  #   valueMapping:
  #     # a literal, the one thing that needs no lookup at all.
  #     host:
  #       source: const
  #       value: my-host
  #     # read out of the claim cr. the path is bare, without braces, which is the only
  #     # spelling a claimParam accepts.
  #     database:
  #       source: claimParam
  #       path: .spec.values.service.database
  #     # read out of an object in the instance namespace. custos cannot read arbitrary
  #     # kinds itself, so this is one of the two sources its gather job is for. the name
  #     # is rendered against the metadata first.
  #     username:
  #       source: objectRef
  #       kind: Secret
  #       name: {{ `{{.ClaimName}}-app` | quote }}
  #       key: username
  #     # the other one. returns the command's stdout.
  #     password:
  #       source: exec
  #       podSelector:
  #         matchLabels:
  #           app: touchstone
  #       command:
  #         - sh
  #         - -c
  #         - printf 'hunter2'
  #     # built from the four above, after they have all resolved. the keys are the ones
  #     # named here; ClaimName, ClaimNamespace, ClaimKind, ClaimAPIVersion,
  #     # InstanceNamespace and ArcanumName are reserved and always in scope.
  #     url:
  #       source: template
  #       value: {{ `postgres://{{.username}}:{{.password}}@{{.host}}:5432/{{.database}}` | quote }}
  credentials: {}
