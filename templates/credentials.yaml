{{- $service := .Release.Name }}
{{- $port := 3306 }}
apiVersion: arcana.helmetica.io/v1
kind: Arcanum
metadata:
  name: credentials
  labels:
    {{- include "azoth.labels" . | nindent 4 }}
spec:
  target:
    name: {{ .Values.credentials.targetSecret | default (printf "%s-credentials" .Release.Name) | quote }}
  credentials:
    valueMapping:
      MARIADB_HOST:
        source: template
        value: {{ printf "%s-vshnmariadb.{{.InstanceNamespace}}.svc.cluster.local" $service | quote }}
      MARIADB_PORT:
        source: const
        value: {{ $port | quote }}
      MARIADB_USERNAME:
        source: const
        value: "root"
      MARIADB_URL:
        source: template
        value: {{ `mariadb://{{.MARIADB_USERNAME}}:{{.MARIADB_PASSWORD | urlquery }}@{{.MARIADB_HOST}}:{{.MARIADB_PORT}}` | quote }}
      {{- if not .Values.service.rootEmptyPassword }}
        {{- if .Values.vshnmariadb.rootPasswordSecretKeyRef }}
      MARIADB_PASSWORD:
        source: objectRef
        kind: Secret
        name: {{ .Values.vshnmariadb.rootPasswordSecretKeyRef.name | quote }}
        key: {{ .Values.vshnmariadb.rootPasswordSecretKeyRef.key | quote }}
        {{else}}
      MARIADB_PASSWORD:
        source: const
        value: {{ .Values.vshnmariadb.rootPassword | quote }}
        {{- end }}
      {{- end }}
      "ca.crt":
        source: objectRef
        kind: Secret
        name: {{ printf "%s-vshnmariadb-ca" $service | quote }}
        key: "ca.crt"
