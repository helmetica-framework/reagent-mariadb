suite: ferment starter chart
release:
  name: instance
tests:
  - it: renders no BackupPolicy unless backups are enabled
    templates:
      - backuppolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: asks ampulla for backups when enabled
    templates:
      - backuppolicy.yaml
    set:
      backup.enabled: true
    asserts:
      - isKind:
          of: BackupPolicy
      - isAPIVersion:
          of: backups.helmetica.io/v1
      - equal:
          path: metadata.name
          value: instance
      - equal:
          path: spec.mode
          value: Schedule
      # Backups belong in the night, so an empty schedule is filled in here rather than
      # left to the controller's `@daily-random`, which may pick the afternoon.
      - matchRegex:
          path: spec.schedule
          pattern: ^[0-9]{1,2} (22|23|0|1|2|3|4|5) \* \* \*$
      - notExists:
          path: spec.pruneSchedule
      - notExists:
          path: spec.checkSchedule
      # An empty retention would render as YAML null, which the API rejects as "must be of
      # type object", and a zero would read as "keep none" rather than "take the default".
      - notExists:
          path: spec.retention

  - it: passes the values through to the policy
    templates:
      - backuppolicy.yaml
    set:
      backup.enabled: true
      backup.schedule.backup: "0 2 * * *"
      backup.bucketClassName: backups-lpg
      backup.retention.keepDaily: 14
    asserts:
      - equal:
          path: spec.schedule
          value: "0 2 * * *"
      - notExists:
          path: spec.pruneSchedule
      - equal:
          path: spec.bucketClassName
          value: backups-lpg
      - equal:
          path: spec.retention.keepDaily
          value: 14
      - notExists:
          path: spec.retention.keepWeekly

  - it: renders a ritual definition per ritual
    templates:
      - rituals/maintenance.yaml
      - rituals/restart.yaml
    asserts:
      - isKind:
          of: Definition
      - isAPIVersion:
          of: rituals.helmetica.io/v1
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never

  - it: restarts the deployment of the release
    templates:
      - rituals/restart.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: ["rollout", "restart", "deployment/instance"]

  - it: names the credentials secret after the release by default
    templates:
      - credentials.yaml
    asserts:
      - isKind:
          of: Arcanum
      - isAPIVersion:
          of: arcana.helmetica.io/v1
      - equal:
          path: spec.target.name
          value: instance-credentials

  - it: lets the reagent name the credentials secret
    templates:
      - credentials.yaml
    set:
      credentials.targetSecret: redis-credentials
    asserts:
      - equal:
          path: spec.target.name
          value: redis-credentials

  - it: seals the service off by default
    templates:
      - network.yaml
    asserts:
      - isKind:
          of: Seal
      - equal:
          path: spec.allowedNamespaces
          value: []
      - equal:
          path: spec.allowAllNamespaces
          value: false

  # Rendered without toYaml this comes out as `[alpha beta]`, which YAML reads as the
  # single string "alpha beta" rather than two namespaces.
  - it: passes every allowed namespace through as its own list entry
    templates:
      - network.yaml
    set:
      network.allowedNamespaces: [alpha, beta]
    asserts:
      - equal:
          path: spec.allowedNamespaces
          value: [alpha, beta]

  - it: labels every resource it renders
    templates:
      - credentials.yaml
      - network.yaml
      - backuppolicy.yaml
      - rituals/maintenance.yaml
      - rituals/restart.yaml
    set:
      backup.enabled: true
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: ferment
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: instance
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  # Helm re-renders on every reconcile. A time drawn at random each time would move the
  # backup every few minutes, so it is hashed out of the instance instead.
  - it: gives an instance the same nightly time on every render
    templates:
      - backuppolicy.yaml
    release:
      name: instance
      namespace: instance-ns
    set:
      backup.enabled: true
    asserts:
      - equal:
          path: spec.schedule
          value: "12 23 * * *"

  - it: gives another instance a different nightly time
    templates:
      - backuppolicy.yaml
    release:
      name: instance
      namespace: other-ns
    set:
      backup.enabled: true
    asserts:
      - notEqual:
          path: spec.schedule
          value: "12 23 * * *"
      - matchRegex:
          path: spec.schedule
          pattern: ^[0-9]{1,2} (22|23|0|1|2|3|4|5) \* \* \*$

  # In BucketOnly mode the service's own operator writes the backups. Ampulla only hands it
  # a bucket, and neither schedule nor retention is its to act on.
  - it: asks for nothing but a bucket when the service backs itself up
    templates:
      - backuppolicy.yaml
    set:
      backup.enabled: true
      backup.mode: BucketOnly
      backup.schedule.backup: "0 2 * * *"
      backup.retention.keepDaily: 14
      backup.bucketClassName: backups-lpg
    asserts:
      - equal:
          path: spec.mode
          value: BucketOnly
      - equal:
          path: spec.bucketClassName
          value: backups-lpg
      - notExists:
          path: spec.schedule
      - notExists:
          path: spec.pruneSchedule
      - notExists:
          path: spec.retention
