# How this service is backed up. The backup controller reads these off the instance; the
# framework itself knows nothing about backups.
backup:
  # Whether the service is backed up at all.
  enabled: true

  # Who takes the backups.
  #   Schedule   - the backup controller provisions a bucket and drives k8up over the
  #                service's volumes.
  #   BucketOnly - it provisions the bucket and stops there, for a service whose own
  #                operator writes backups to object storage (CloudNativePG, MariaDB).
  '#mode':
    type: string
    enum: [Schedule, BucketOnly]
  mode: Schedule

  # When each job runs, as a cron expression or a k8up shortcut like `@daily-random`.
  # Only used with mode Schedule.
  #
  # An empty backup gets a nightly time between 22:00 and 06:00, generated from the name
  # of the instance so that it stays put across upgrades and no two instances start in the
  # same minute. Empty prune and check take the backup controller's default, which runs
  # them weekly.
  schedule:
    backup: ""
    prune: ""
    check: ""

  # The COSI classes the bucket is provisioned from. Empty takes the backup controller's
  # default, which is how a cluster keeps all its backups in one place.
  bucketClassName: ""
  bucketAccessClassName: ""

  # How many backups survive a prune. All zero takes the backup controller's default
  # retention. Only used with mode Schedule.
  retention:
    keepLast: 0
    keepHourly: 0
    keepDaily: 0
    keepWeekly: 0
    keepMonthly: 0
    keepYearly: 0

network:
  # Whether the framework seals this service off at all. Not settable on a claim.
  '#enabled':
    export: false
  enabled: true

  # A list of allowed namespaces. The namespace where the claim resides is
  # always included implicitly.
  '#allowedNamespaces':
    items:
      '#':
        type: string
  allowedNamespaces: []

  # Allow access from all namespaces.
  allowAllNamespaces: false

# When this service's maintenance runs. The adept reads these off the instance.
maintenance:
  # Which MaintenanceWindow this instance starts in. Empty takes the
  # operator's default window.
  window: ""

  # Whether maintenance runs at all. A suspended instance keeps its schedule
  # and does not fire it.
  suspend: false

credentials:
  # Secret name which will contain the service's connection details.
  # Defaults to releaseName-credentials.
  targetSecret: ""

'#replicas':
  type: integer
  enum: [1,3,5,7]
replicas: 1

# The size of the instance. The number is gibibytes of memory the pod may use, and cpu
# follows it at 250 millicores per gibibyte. Requests are set equal to the limits, so the
# pod is Guaranteed.
'#plan':
  type: string
  enum: [standard-1, standard-2, standard-4, standard-8, standard-16]
plan: standard-1

# The service's values go here
service:
  replicas: "cel: values.replicas"
  myCnf: ""
  rootEmptyPassword: false
  rootPasswordSecretKeyRef:
    generate: true
    key: root
    name: mariadb-cluster-root
  image: "mariadb:11.8.9"
  storage:
    ephemeral: false
    resizeInUseVolumes: true
    size: 1Gi
    volumeClaimTemplate:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    waitForVolumeResize: true
  replicasAllowEvenNumber: false

  galera:
    enabled: "cel: values.replicas > 1 ? true : false"

  startupProbe:
    failureThreshold: 120

  tls:
    enabled: true

  suspend: false

  updateStrategy:
    autoUpdateDataPlane: false
    type: ReplicasFirstPrimaryLast
