# How this service is backed up. mariadb-operator takes the backups itself with a
# PhysicalBackup (templates/backup.yaml); ampulla provisions the bucket it writes to.
backup:
  # Whether the service is backed up at all.
  enabled: true

  # The operator writes the backups, ampulla only provisions the bucket. Not settable on a
  # claim: a k8up copy of a running database's volumes is no consistent backup.
  '#mode':
    export: false
  mode: BucketOnly

  # When the backup runs, as a cron expression. Empty gets a nightly time between 22:00
  # and 06:00, generated from the name of the instance so that it stays put across
  # upgrades and no two instances start in the same minute.
  schedule:
    backup: ""

  # How long a backup is kept, as a duration.
  maxRetention: 720h

  # The COSI classes the bucket is provisioned from. Empty takes the backup controller's
  # default, which is how a cluster keeps all its backups in one place.
  bucketClassName: ""
  bucketAccessClassName: ""

network:
  # Whether the framework seals this service off at all. Not settable on a claim.
  '#enabled':
    export: false
  enabled: true

  # A list of allowed namespaces. The namespace where the claim resides is
  # always included implicitly.
  '#allowedNamespaces':
    items:
      '#':
        type: string
  allowedNamespaces: []

  # Allow access from all namespaces.
  allowAllNamespaces: false

# When this service's maintenance runs. The adept reads these off the instance.
maintenance:
  # Which MaintenanceWindow this instance starts in. Empty takes the
  # operator's default window.
  window: ""

  # Whether maintenance runs at all. A suspended instance keeps its schedule
  # and does not fire it.
  suspend: false

credentials:
  # Prefix of the Secret name holding the connection details. Defaults to the claim name.
  prefix: ""

alerting:
  enabled: true
  serviceOperator:
    '#emailAddresses':
      items:
        '#':
          type: string
    emailAddresses: []

# The service's values go here
service:
  '#replicas':
    type: integer
    enum: [1,3,5,7]
  replicas: 1

  # The size of the instance. The number is gibibytes of memory the pod may use, and cpu
  # follows it at 250 millicores per gibibyte. Requests are set equal to the limits, so the
  # pod is Guaranteed.
  '#plan':
    type: string
    enum: [standard-1, standard-2, standard-4, standard-8, standard-16]
  plan: standard-1

  rootEmptyPassword: false

'#vshnmariadb':
  export: false
vshnmariadb:
  replicas: "cel: values.service.replicas"
  plan: "cel: values.service.plan"
  myCnf: ""
  rootEmptyPassword: "cel: values.service.rootEmptyPassword"
  rootPasswordSecretKeyRef:
    generate: true
    key: root
    name: mariadb-cluster-root
  image: "mariadb:11.8.8"
  storage:
    ephemeral: false
    resizeInUseVolumes: true
    size: 1Gi
    volumeClaimTemplate:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
    waitForVolumeResize: true
  replicasAllowEvenNumber: false

  galera:
    enabled: "cel: values.service.replicas > 1 ? true : false"
    agent:
      basicAuth:
        enabled: true

  startupProbe:
    failureThreshold: 120

  tls:
    enabled: true

  suspend: false

  updateStrategy:
    autoUpdateDataPlane: false
    type: ReplicasFirstPrimaryLast

  # The upstream chart's own PhysicalBackup needs the bucket up front. templates/backup.yaml
  # replaces it.
  backup:
    enabled: false
